[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "senertec-dachs"
dynamic = ["version"]
description = "Async Python client for SenerTec Dachs combined heat and power units (BHKWs). Supports local access to MSR2 and (experimental) MSR3 controllers and the old Dachsportal cloud; DachsConnect (cloud2) support is in development."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "skuza.it" }]

keywords = ["senertec", "dachs", "msr2", "chp", "cogeneration", "home-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = ["aiohttp>=3.11,<4"]

[project.urls]
Homepage = "https://github.com/skuzait/senertec-dachs"
Repository = "https://github.com/skuzait/senertec-dachs"
Issues = "https://github.com/skuzait/senertec-dachs/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=0.24,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# Version comes from the git tag (PEP 440: v0.2.0 -> 0.2.0).
# Builds without git metadata fail on purpose: CI always checks out the
# release tag, `pip install git+…` carries history, and PyPI sdists embed
# the version in PKG-INFO. Only a GitHub zip dump has neither — and a
# hard error beats silently shipping a wrong version number.

[tool.setuptools.package-data]
senertec_dachs = ["data/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
